name: SwiftLint

on:
  pull_request:
    paths:
      - '**/*.swift'
      - '.swiftlint.yml'
      - '.github/workflows/swiftlint.yml'

jobs:
  # 共通ワークフローに委譲する。lint の実体 (SwiftLint を公式 Docker image で
  # 実行する構成) は jiikko/shared-workflows 側が正本。個別アプリで素の
  # swiftlint_linux.zip を bare ubuntu で直接実行すると libsourcekitdInProc.so の
  # ロードに失敗して exit 132 でクラッシュする (umbrella issues/026)。
  swiftlint:
    uses: jiikko/shared-workflows/.github/workflows/swiftlint.yml@main
